name: Unity Development Build

on:
  schedule:
    # Runs every Sunday at 19:00 UTC — adjust to your preferred time
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  await-approval:
    name: Waiting for build approval
    runs-on: ubuntu-latest
    environment: build-approval
    steps:
      - name: Approval received
        run: echo "Build approved, proceeding..."

  build:
    name: Development Build
    needs: await-approval 
    runs-on: ubuntu-latest

    strategy:
      matrix:
        targetPlatform:
          - StandaloneWindows64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-6000.3.9f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-6000.3.9f1-

      - name: Build Project (Development)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.9f1
          targetPlatform: ${{ matrix.targetPlatform }}
          customParameters: -Development -AllowDebugging

      - name: Zip Build
        run: |
          cd build
          zip -r ../Build-${{ matrix.targetPlatform }}.zip ${{ matrix.targetPlatform }}/

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: Build-${{ matrix.targetPlatform }}.zip
